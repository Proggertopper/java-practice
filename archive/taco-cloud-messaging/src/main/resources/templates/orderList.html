<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список заказов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even){background-color: #f9f9f9;}
        tr:hover {background-color: #eaeaea;}
    </style>
</head>
<body>
<h1>Ваши заказы</h1>

<table>
    <thead>
    <tr>
        <th>Номер заказа</th>
        <th>Имя</th>
        <th>Адрес</th>
        <th>Дата заказа</th>
        <th>Ингредиенты</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1</td>
        <td th:text="${order.deliveryName}">Имя</td>
        <td>
            <span th:text="${order.deliveryStreet}">Улица</span>,
            <span th:text="${order.deliveryCity}">Город</span>,
            <span th:text="${order.deliveryState}">Штат</span>,
            <span th:text="${order.deliveryZip}">ZIP</span>
        </td>
        <td th:text="${#dates.format(order.placedAt, 'dd-MM-yyyy HH:mm')}">Дата</td>
        <td>
            <span th:each="ingredient : ${order.ingredients}" th:text="${ingredient.name} + ' '">Ингредиент </span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
