server.port=8080
spring.application.name=taco_cloud2
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:practice_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.security=DEBUG

spring.security.oauth2.client.registration.facebook.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
