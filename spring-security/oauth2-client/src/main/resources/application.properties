spring.security.oauth2.client.registration.taco-admin-client.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.taco-admin-client.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.taco-admin-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.taco-admin-client.redirect-uri=http://localhost:9090/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.taco-admin-client.scope=openid,writeIngredients,deleteIngredients
spring.security.oauth2.client.provider.taco-admin-client.issuer-uri=http://localhost:9000

# server.servlet.session.cookie.same-site=none
#servlet.session.cookie.secure=false
#server.servlet.session.tracking-modes=cookie

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.security.oauth2.client.web=TRACE
logging.level.org.springframework.security.oauth2.client.endpoint=TRACE






